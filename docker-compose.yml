services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Inside Docker the databases are reached by service name.
      MONGO_URI: mongodb://mongo:27017/kobomarket
      DATABASE_URL: postgres://kobo:kobo_password@postgres:5432/kobomarket
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kobo
      POSTGRES_PASSWORD: kobo_password
      POSTGRES_DB: kobomarket
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kobo -d kobomarket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
  pg_data:
